name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          Z=""; T=0
          for f in project*.zip; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "$t" -gt "$T" ]; then T=$t; Z="$f"; fi
          done
          echo "Using: $Z"
          unzip -q "$Z" -d proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: cd proj && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MyDiary-APK
          path: proj/app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create "v${{ github.run_number }}" proj/app/build/outputs/apk/debug/app-debug.apk --title "My diary build ${{ github.run_number }}" --notes "My diary APK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
